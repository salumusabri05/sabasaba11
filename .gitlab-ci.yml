stages:
  - deploy

deploy_docker:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "makisatu"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
  before_script:
    - echo "Setting up SSH key for VPS deployment..."
    - apk add --no-cache openssh-client bash
    - eval $(ssh-agent -s)
    # Support both Base64-encoded key and raw SSH key
    - |
      if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
        echo "$SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' | ssh-add -
      elif [ -n "$SSH_PRIVATE_KEY" ]; then
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
      else
        echo "ERROR: Neither SSH_PRIVATE_KEY_B64 nor SSH_PRIVATE_KEY is set in GitLab CI/CD variables!"
        exit 1
      fi
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H "${SERVER_IP:-169.58.79.218}" >> ~/.ssh/known_hosts || true
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
  script:
    - echo "Deploying Docker container to ${SERVER_USER:-root}@${SERVER_IP:-169.58.79.218}:/var/www/makisatu..."
    - |
      ssh ${SERVER_USER:-root}@${SERVER_IP:-169.58.79.218} "bash -s" << 'EOF'
        set -e

        TARGET_DIR="/var/www/makisatu"

        echo "=== 1. Navigating to project directory: $TARGET_DIR ==="
        if [ ! -d "$TARGET_DIR" ]; then
          mkdir -p $TARGET_DIR
        fi
        cd $TARGET_DIR

        echo "=== 2. Pulling latest code for branch: ${CI_COMMIT_BRANCH:-makisatu} ==="
        git fetch --all
        git checkout ${CI_COMMIT_BRANCH:-makisatu}
        git reset --hard origin/${CI_COMMIT_BRANCH:-makisatu}

        echo "=== 3. Building Docker image from Dockerfile ==="
        docker build -t makisatu-api:latest .

        echo "=== 4. Stopping & removing old container if running ==="
        if docker ps -a --format '{{.Names}}' | grep -q "^makisatu-api$"; then
          echo "Stopping and removing existing container 'makisatu-api'..."
          docker stop makisatu-api || true
          docker rm makisatu-api || true
        fi

        echo "=== 5. Running new Docker container on port 5004 ==="
        docker run -d \
          --name makisatu-api \
          --restart always \
          -p 5004:8000 \
          -e PORT=8000 \
          makisatu-api:latest

        echo "=== 6. Cleaning up unused images ==="
        docker image prune -f || true

        echo "=== Docker Deployment Completed Successfully! ==="
      EOF
